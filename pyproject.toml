[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-sim"
version = "0.1.0"
description = "World-Sim narrative simulation project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "chromadb>=0.5",
    "openai>=1.40",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=12.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
world-sim = "world_sim.cli:main"
world-builder = "world_sim.builder.cli:main"
world-sim-serve = "world_sim.server.web_main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["world_sim*"]

[tool.setuptools.package-data]
world_sim = ["server/static/*"]
