[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-sim"
version = "0.1.0"
description = "World-Sim narrative simulation project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
world-sim = "world_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["world_sim*"]
