[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "world-sim"
version = "0.1.0"
description = "World-Sim narrative simulation project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "chromadb>=0.5",
    "openai>=1.40",
    "anthropic>=0.40",
]

[project.scripts]
world-sim = "world_sim.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["world_sim*"]
